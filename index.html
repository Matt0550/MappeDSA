    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Effetto di animazione del bordo glow */
        .animated-border-box {
            position: relative;
            padding: 2px;
            border-radius: 9999px;
            overflow: hidden;
            background: transparent;
            box-shadow: 0 0px 250px rgba(58, 82, 255, 0.5), 0 0px 250px rgba(175, 14, 249, 0.5);
        }

        .animated-border-box::before,
        .animated-border-box-glow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            width: 99999px;
            height: 99999px;
            background-image: conic-gradient(rgba(58, 82, 255, 0.1), rgba(175, 14, 249, 0.8), rgba(0, 0, 0, 0) 25%);
            animation: rotate 4s linear infinite;
            z-index: -1;
        }

        .animated-border-box::after {
            content: '';
            position: absolute;
            z-index: -1;
            left: 5px;
            top: 5px;
            width: calc(100% - 10px);
            height: calc(100% - 10px);
            background: #292a2e;
            border-radius: inherit;
        }

        @keyframes rotate {
            100% {
                transform: translate(-50%, -50%) rotate(1turn);
            }
        }
     
    </style>
</head>
