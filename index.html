<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MappeDSA | Link Bio</title>

    <!-- Meta Tags -->
    <meta name="title" content="MappeDSA | Link Bio">
    <meta name="description"
        content="Cerca tra centinaia di mappe concettuali e appunti gratuiti e seguici sui social!">
    <meta name="author" content="MappeDSA">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f8fbff">

    <!-- Open Graph -->
    <meta property="og:title" content="MappeDSA | Link Bio">
    <meta property="og:description"
        content="Cerca tra centinaia di mappe concettuali e appunti gratuiti e seguici sui social!">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mappedsa.altervista.org/">
    <meta property="og:image" content="https://mappedsa.altervista.org/static/favicon/web-app-manifest-512x512.png">
    <meta property="og:site_name" content="MappeDSA">
    <meta property="og:locale" content="it_IT">

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Glassmorphism background + glass utilities (light mode, inspired by GlassLink-Bio) -->
    <style>
        :root {
            color-scheme: light;
        }

        body {
            font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        /* Animated soft gradient background */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at top left, #dbeafe 0%, transparent 32%),
                radial-gradient(circle at bottom right, #bfdbfe 0%, transparent 30%),
                radial-gradient(circle at bottom left, #f5d0fe 0%, transparent 28%),
                linear-gradient(135deg, #f8fbff, #eef4ff);
            background-size: 160% 160%;
            animation: drift 18s ease-in-out infinite;
        }

        @keyframes drift {

            0%,
            100% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 100%;
            }
        }

        /* Frosted glass card */
        .glass {
            background: rgba(255, 255, 255, .72);
            border: 1px solid rgba(255, 255, 255, .7);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
        }

        /* Smooth scroll-reveal */
        .reveal {
            opacity: 0;
            transform: translateY(12px);
            animation: rise .6s ease forwards;
        }

        .reveal:nth-child(2) {
            animation-delay: .08s;
        }

        .reveal:nth-child(3) {
            animation-delay: .16s;
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen text-slate-800 flex flex-col items-center px-4 py-10">
    <div class="bg"></div>

    <main class="w-full max-w-md flex flex-col gap-5">

        <!-- Profile card -->
        <section class="glass rounded-[32px] p-6 reveal">
            <div class="flex items-center gap-4">
                <img src="/static/favicon/web-app-manifest-192x192.png" alt="Logo MappeDSA"
                    class="w-[86px] h-[86px] rounded-full object-cover border-[3px] border-white/80 shadow-sm">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900">MappeDSA</h1>
                    <p class="text-sm text-slate-500 leading-snug mt-1">Centinaia di mappe concettuali e appunti
                        completamente <span class="font-semibold text-slate-700">GRATIS</span>!</p>
                </div>
            </div>

            <!-- Social icons (rendered from JS list, see script below) -->
            <div id="socials" class="flex flex-wrap gap-3 mt-6"></div>
        </section>

        <!-- Search bar as primary CTA -->
        <section class="glass rounded-[32px] p-6 reveal">
            <h2 class="text-base font-bold text-slate-900 mb-1">Cerca una mappa o appunti</h2>
            <p class="text-sm text-slate-500 mb-4">Trova subito quello che ti serve tra centinaia di risorse gratuite.
            </p>

            <div
                class="flex items-center gap-2 bg-white/90 rounded-full p-1.5 shadow-[0_4px_12px_rgba(15,23,42,.04)] focus-within:ring-2 focus-within:ring-blue-300 transition">
                <input type="text" id="search" autocomplete="off" placeholder="Es. Rivoluzione francese, fotosintesi..."
                    class="flex-1 bg-transparent focus:outline-none px-4 py-2.5 text-slate-800 placeholder:text-slate-400 text-sm">
                <button type="button" onclick="searchPosts()" aria-label="Cerca"
                    class="shrink-0 inline-flex items-center gap-1.5 rounded-full px-4 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 active:scale-95 transition shadow-md">
                    <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                    Cerca
                </button>
            </div>
        </section>

        <!-- Link buttons (rendered from JS list, see script below) -->
        <section id="links" class="glass rounded-[32px] p-4 flex flex-col gap-3 reveal"></section>

        <!-- Footer -->
        <footer class="text-center text-xs text-slate-400 mt-2 mb-4">
            <div class="flex flex-wrap items-center justify-center gap-2">
                <span>© {{ year }} MappeDSA</span>
                <span class="text-slate-300">|</span>
                <a href="https://www.iubenda.com/privacy-policy/98716495" target="_blank" rel="noopener"
                    class="hover:text-slate-600 transition">Privacy Policy</a>
            </div>
        </footer>

    </main>

    <script>
        const year = new Date().getFullYear();
        document.querySelector('footer span').textContent = `© ${year} MappeDSA`;

        // --- Social links (data-driven, Font Awesome icons) ---
        const socials = [
            { label: 'Instagram', href: 'https://instagram.com/mappe.dsa', icon: 'fa-brands fa-instagram', hover: 'hover:text-pink-600' },
            { label: 'TikTok', href: 'https://www.tiktok.com/@mappe.dsa', icon: 'fa-brands fa-tiktok', hover: 'hover:text-slate-900' },
            { label: 'Facebook', href: 'https://facebook.com/profile.php?id=61565118999032', icon: 'fa-brands fa-facebook-f', hover: 'hover:text-blue-600' },
            { label: 'Telegram', href: 'https://t.me/mappedsa', icon: 'fa-brands fa-telegram', hover: 'hover:text-sky-500' }
        ];

        const socialsContainer = document.getElementById('socials');
        socialsContainer.innerHTML = socials.map(s => `
            <a href="${s.href}" target="_blank" rel="noopener" aria-label="${s.label}"
                class="w-[52px] h-[52px] rounded-[18px] grid place-items-center bg-white/90 shadow-[0_4px_12px_rgba(15,23,42,.04)] text-slate-700 ${s.hover} hover:-translate-y-0.5 transition duration-200">
                <i class="${s.icon} text-xl"></i>
            </a>`).join('');

        // --- Link buttons (data-driven, Font Awesome icons) ---
        // `highlight: true` gives the button a colored gradient instead of the plain glass style.
        const links = [
            { label: 'Visita il sito MappeDSA', href: 'https://go.mappedsa.it/website', icon: 'fa-solid fa-globe', chip: 'bg-indigo-50 text-indigo-600', highlight: true },
            { label: 'Richiedi una mappa o appunti', href: 'https://go.mappedsa.it/richiedi-appunti', icon: 'fa-solid fa-plus', chip: 'bg-blue-50 text-blue-600' },
            { label: 'Sostieni il progetto', href: 'https://go.mappedsa.it/donazioni', icon: 'fa-solid fa-heart', chip: 'bg-rose-50 text-rose-500' },
            { label: 'Contattaci / Supporto', href: 'https://go.mappedsa.it/supporto', icon: 'fa-solid fa-headset', chip: 'bg-emerald-50 text-emerald-600' }
        ];

        const linksContainer = document.getElementById('links');
        linksContainer.innerHTML = links.map(l => {
            const base = 'group flex items-center justify-between gap-3 rounded-2xl px-4 py-3.5 shadow-[0_4px_12px_rgba(15,23,42,.04)] hover:translate-x-[3px] transition duration-200';
            const style = l.highlight ? 'bg-gradient-to-r from-blue-500 to-cyan-500 shadow-md' : 'bg-white/90';
            const chip = l.highlight ? 'bg-white/20 text-white' : l.chip;
            const labelColor = l.highlight ? 'text-white' : 'text-slate-800';
            const chevron = l.highlight ? 'text-white/80' : 'text-slate-400 group-hover:text-slate-600';
            return `
                <a href="${l.href}" target="_blank" rel="noopener" class="${base} ${style}">
                    <span class="flex items-center gap-3">
                        <span class="w-9 h-9 grid place-items-center rounded-xl ${chip}">
                            <i class="${l.icon}"></i>
                        </span>
                        <span class="font-semibold ${labelColor} text-sm">${l.label}</span>
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs ${chevron}"></i>
                </a>`;
        }).join('');

        function searchPosts() {
            const input = document.getElementById('search');
            const query = input.value.trim();
            if (!query) {
                input.focus();
                return;
            }
            const url = 'https://mappedsa.altervista.org/?s=' + encodeURIComponent(query)
                + '&utm_source=mappedsa_it&utm_medium=web&utm_campaign=link_in_bio';
            window.open(url, '_blank');
            input.value = '';
        }

        // Submit on Enter
        document.getElementById('search').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchPosts();
            }
        });
    </script>

</body>

</html>
